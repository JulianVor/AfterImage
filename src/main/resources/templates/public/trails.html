<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('GESCHICHTEN')}"></head>
<body>
<header th:replace="~{fragments :: nav('trails')}"></header>
<main>
    <section class="page-intro" aria-labelledby="trails-title">
        <p class="eyebrow">Archiv</p>
        <h1 id="trails-title">Geschichten</h1>
        <p class="intro-lead">Ausgewählte Themen aus dem Archiv, erzählt über Werke, Menschen und Orte.</p>
    </section>

    <section class="home-section" aria-label="Geschichten">
        <ul class="home-grid home-grid--two" th:if="${!trails.isEmpty()}">
            <li th:each="trail, state : ${trails}">
                <a th:href="@{/trails/{slug}(slug=${trail.slug})}">
                    <span class="home-thumb home-thumb--story">
                        <img th:if="${heroMediaByTrail[trail.id] != null}" th:src="@{/media/{id}(id=${heroMediaByTrail[trail.id].id})}"
                             th:alt="${heroMediaByTrail[trail.id].altText ?: trail.title}"
                             th:attr="width=${heroMediaByTrail[trail.id].width},height=${heroMediaByTrail[trail.id].height}" loading="lazy" decoding="async">
                        <span class="home-thumb-plate" th:unless="${heroMediaByTrail[trail.id] != null}" th:text="${labels.of(trail.storyType)}">Dossier</span>
                    </span>
                    <span class="home-sub"><span th:text="${labels.of(trail.storyType)}">Dossier</span> · <span th:text="${trail.steps.size()}">3</span> Bausteine</span>
                    <span class="home-title" th:text="${trail.title}">Geschichtentitel</span>
                    <span class="home-desc" th:text="${leadDescriptionByTrail[trail.id] ?: 'Eine kuratierte Geschichte aus dem Archiv.'}">Beschreibung</span>
                </a>
            </li>
        </ul>

        <p class="page-note" th:if="${trails.isEmpty()}">Noch wurde keine öffentliche Geschichte kuratiert.</p>

        <aside class="trail-connect-invite">
            <span>Möchtest du Anfang und Ende selbst wählen?</span>
            <a href="/connect">Verbindung zwischen zwei Einträgen finden →</a>
        </aside>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
