<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" class="album-theme"
      style="--album-bg:#151412;--album-ink:#ece6da;--album-accent:#c8431c">
<head th:replace="~{fragments :: head('Alben')}"></head>
<body class="alben-page">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Hanken+Grotesk:wght@300;400&family=Belleza&family=Jost:wght@300;400&family=Barlow:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/alben.css">
<header th:replace="~{fragments :: nav('alben')}"></header>
<main class="alben-index">
    <header class="alben-heading">
        <p class="eyebrow">Alben</p>
        <h1>Alben, die es nicht gibt</h1>
    </header>
    <ol class="alben-grid">
        <li th:each="album : ${albums}" th:classappend="${'album--' + album.fontKey}">
            <a th:href="@{/alben/{slug}(slug=${album.slug})}">
                <span class="album-cover">
                    <img class="album-cover-front" th:src="${album.frontThumbUrl}" width="700" height="700"
                         th:alt="${'Cover von ' + album.title}" loading="lazy">
                    <img class="album-cover-back" th:src="${album.backThumbUrl}" width="700" height="700"
                         alt="" aria-hidden="true" loading="lazy">
                </span>
                <span class="album-caption">
                    <span class="album-number" th:text="${album.number}">FA-001</span>
                    <span class="album-name" th:text="${album.title}">Titel</span>
                </span>
            </a>
        </li>
    </ol>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
