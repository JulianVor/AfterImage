<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('CHRONIK')}"></head>
<body>
<header th:replace="~{fragments :: nav('chronicle')}"></header>
<main>
    <section class="page-intro" aria-labelledby="chronicle-title">
        <p class="eyebrow">Archiv</p>
        <h1 id="chronicle-title">Chronik</h1>
        <p class="intro-lead">Projekte, Veröffentlichungen, Drehs und Konzerte, Jahr für Jahr.</p>
    </section>

    <section class="list-section" aria-label="Jahr auswählen" th:if="${!chronicle.years.isEmpty()}">
        <nav class="year-index" aria-label="Jahr auswählen">
            <a th:each="availableYear : ${chronicle.years}" th:href="@{/chronicle(year=${availableYear})}"
               th:text="${availableYear}" th:classappend="${availableYear == chronicle.selectedYear ? 'is-active' : ''}"
               th:attr="aria-current=${availableYear == chronicle.selectedYear ? 'page' : null}">2024</a>
        </nav>
    </section>

    <section class="list-section" th:attr="aria-label=${'Chronik ' + chronicle.selectedYear}">
        <header class="list-head" th:if="${chronicle.selectedYear != null}">
            <h2 th:text="${chronicle.selectedYear}">2024</h2>
            <p th:text="${chronicle.moments.size() == 1 ? '1 Moment' : chronicle.moments.size() + ' Momente'}">15 Momente</p>
        </header>
        <p class="page-note" th:if="${chronicle.moments.isEmpty()}">Noch keine datierten Archivmomente vorhanden.</p>
        <ol class="chronicle-list" th:unless="${chronicle.moments.isEmpty()}">
            <li th:each="moment : ${chronicle.moments}">
                <time th:datetime="${moment.date}" th:text="${moment.dateLabel}">4. Mai</time>
                <a th:href="${moment.url}">
                    <strong th:text="${moment.title}">Titel</strong>
                    <small><span th:text="${moment.event}">Veröffentlichung</span> · <span th:text="${labels.of(moment.type)}">Projekt</span></small>
                </a>
            </li>
        </ol>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
